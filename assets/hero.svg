  <rect width="1200" height="380" rx="6" fill="#0D1117"/>
  <rect width="14" height="380" fill="#2F5BFF"/>

  <text class="mono" x="60" y="57" fill="#8B949E" font-size="11" letter-spacing="2.5">PROFILE / 2026</text>
