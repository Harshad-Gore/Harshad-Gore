  <line x1="780" y1="117" x2="780" y2="326" stroke="#30363D"/>
  <g class="mono" font-size="13" letter-spacing="2.2">
    <text x="830" y="150" fill="#F0F3F6">ARTIFICIAL INTELLIGENCE</text>
    <text x="830" y="198" fill="#F0F3F6">CLOUD SYSTEMS</text>
