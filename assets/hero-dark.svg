<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Harshad</title>
  <desc id="desc">Dark profile header with a small animated Pong game.</desc>
  <style>
    .sans { font-family: Inter, Helvetica Neue, Arial, sans-serif; }
    .mono { font-family: IBM Plex Mono, SFMono-Regular, Consolas, monospace; }
    .ball { transform:translate(970px,196px); animation:ball 7s linear infinite; }
    .paddle-left { animation:leftPaddle 7s ease-in-out infinite; }
    .paddle-right { animation:rightPaddle 7s ease-in-out infinite; }
    @keyframes ball {
      0% { transform:translate(835px,138px) }
      20% { transform:translate(1111px,228px) }
      40% { transform:translate(835px,271px) }
      60% { transform:translate(1111px,142px) }
      80% { transform:translate(835px,201px) }
      100% { transform:translate(835px,138px) }
    }
    @keyframes leftPaddle {
      0%,100% { transform:translateY(8px) }
      40% { transform:translateY(132px) }
      80% { transform:translateY(65px) }
    }
    @keyframes rightPaddle {
      0%,100% { transform:translateY(98px) }
      20% { transform:translateY(92px) }
      60% { transform:translateY(6px) }
    }
    @media (prefers-reduced-motion: reduce) {
      .ball, .paddle-left, .paddle-right { animation:none }
      .paddle-left { transform:translateY(60px) }
      .paddle-right { transform:translateY(60px) }
    }
  </style>

  <rect width="1200" height="390" rx="6" fill="#0D1117"/>
  <rect width="14" height="390" fill="#2F81F7"/>

  <text class="mono" x="60" y="57" fill="#8B949E" font-size="11" letter-spacing="2.5">PROFILE / 2026</text>
  <text class="mono" x="1140" y="57" text-anchor="end" fill="#8B949E" font-size="11" letter-spacing="2.5">THEME / DARK</text>
  <line x1="60" y1="78" x2="1140" y2="78" stroke="#30363D"/>

  <text class="sans" x="55" y="223" fill="#F0F6FC" font-size="112" font-weight="750" letter-spacing="-6">HARSHAD</text>
  <rect x="61" y="247" width="474" height="7" fill="#2F81F7"/>
  <text class="mono" x="61" y="306" fill="#B1BAC4" font-size="12" letter-spacing="2">PUNE, INDIA / CLASS OF 2027</text>

  <g>
    <rect x="790" y="106" width="350" height="205" rx="3" fill="none" stroke="#30363D"/>
    <line x1="965" y1="106" x2="965" y2="311" stroke="#30363D" stroke-dasharray="7 9"/>
    <text class="mono" x="790" y="93" fill="#8B949E" font-size="9" letter-spacing="2">PONG / AUTOPLAY</text>
    <text class="mono" x="1140" y="93" text-anchor="end" fill="#8B949E" font-size="9" letter-spacing="2">01 : 01</text>
    <rect class="paddle-left" x="817" y="118" width="6" height="54" rx="3" fill="#F0F6FC"/>
    <rect class="paddle-right" x="1107" y="118" width="6" height="54" rx="3" fill="#F0F6FC"/>
    <circle class="ball" cx="0" cy="0" r="6" fill="#2F81F7"/>
  </g>

  <line x1="60" y1="346" x2="1140" y2="346" stroke="#30363D"/>
  <text class="mono" x="60" y="370" fill="#6E7681" font-size="9" letter-spacing="2">AI SYSTEMS / ACCESSIBLE INTERFACES</text>
</svg>
